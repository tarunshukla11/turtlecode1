import turtle


OFFSET_X = 96
OFFSET_Y = -50


def setup(x, y):
    turtle.setx(x)
    turtle.sety(y)
    print(x, y)


class Draw_Pikachu:

    def __init__(self):
        self.t = turtle.Turtle()
        t = self.t
        t.pensize(3)
        t.speed(9)
        t.ondrag(setup)
        t.penup()
        t.goto(OFFSET_X, OFFSET_Y)
        t.pendown()

    def meme(self, x, y):
        self.t.penup()
        self.t.goto(x + OFFSET_X, y + OFFSET_Y)
        self.t.pendown()

    def aankha1(self, x, y):
        self.meme(x, y)
        t = self.t
        t.seth(0)
        t.fillcolor('#333333')
        t.begin_fill()
        t.circle(22)
        t.end_fill()

        self.meme(x, y + 10)
        t.fillcolor('#000000')
        t.begin_fill()
        t.circle(10)
        t.end_fill()

        self.meme(x + 6, y + 22)
        t.fillcolor('#ffffff')
        t.begin_fill()
        t.circle(10)
        t.end_fill()

    def aankha2(self, x, y):
        self.meme(x, y)
        t = self.t
        t.seth(0)
        t.fillcolor('#333333')
        t.begin_fill()
        t.circle(22)
        t.end_fill()

        self.meme(x, y + 10)
        t.fillcolor('#000000')
        t.begin_fill()
        t.circle(10)
        t.end_fill()

        self.meme(x - 6, y + 22)
        t.fillcolor('#ffffff')
        t.begin_fill()
        t.circle(10)
        t.end_fill()

    def mukh(self, x, y):
        self.meme(x, y)
        t = self.t

        t.fillcolor('#88141D')
        t.begin_fill()
        #
        l1 = []
        l2 = []
        t.seth(190)
        a = 0.7
        for i in range(28):
            a += 0.1
            t.right(3)
            t.fd(a)
            l1.append(t.position())

        self.meme(x, y)

        t.seth(10)
        a = 0.7
        for i in range(28):
            a += 0.1
            t.left(3)
            t.fd(a)
            l2.append(t.position())

        #

        t.seth(10)
        t.circle(50, 15)
        t.left(180)
        t.circle(-50, 15)

        t.circle(-50, 40)
        t.seth(233)
        t.circle(-50, 55)
        t.left(180)
        t.circle(50, 12.1)
        t.end_fill()

        #
        self.meme(17, 54)
        t.fillcolor('#DD716F')
        t.begin_fill()
        t.seth(145)
        t.circle(40, 86)
        t.penup()
        for pos in reversed(l1[:20]):
            t.goto(pos[0], pos[1] + 1.5)
        for pos in l2[:20]:
            t.goto(pos[0], pos[1] + 1.5)
        t.pendown()
        t.end_fill()

        #
        self.meme(-17, 94)
        t.seth(8)
        t.fd(4)
        t.back(8)

    #
    def gaala1(self, x, y):
        turtle.tracer(False)
        t = self.t
        self.meme(x, y)
        t.seth(300)
        t.fillcolor('#DD4D28')
        t.begin_fill()
        a = 2.3
        for i in range(120):
            if 0 <= i < 30 or 60 <= i < 90:
                a -= 0.05
                t.lt(3)
                t.fd(a)
            else:
                a += 0.05
                t.lt(3)
                t.fd(a)
        t.end_fill()
        turtle.tracer(True)

    def gaala2(self, x, y):
        t = self.t
        turtle.tracer(False)
        self.meme(x, y)
        t.seth(60)
        t.fillcolor('#DD4D28')
        t.begin_fill()
        a = 2.3

            if 0 <= i < 30 or 60 <= i < 90:
                a -= 0.05
                t.lt(3)
                t.fd(a)
            else:
                a += 0.05
                t.lt(3)
                t.fd(a)
        t.end_fill()
        turtle.tracer(True)

    def kaan1(self, x, y):
        t = self.t
        self.meme(x, y)
        t.fillcolor('#000000')
        t.begin_fill()
        t.seth(330)
        t.circle(100, 35)
        t.seth(219)
        t.circle(-300, 19)
        t.seth(110)
        t.circle(-30, 50)
        t.circle(-300, 10)
        t.end_fill()

    def kaan2(self, x, y):
        t = self.t
        self.meme(x, y)
        t.fillcolor('#000000')
        t.begin_fill()

        #
        t.seth(200)

        t.seth(20)
        t.circle(300, 35)
        # print(t.pos())

        #
        t.seth(240)
        t.circle(105, 95)
        t.left(180)

        #
        t.seth(210)
        t.circle(500, 18)
        t.seth(200)
        t.fd(10)
        t.seth(280)
        t.fd(7)
        t.seth(210)
        t.fd(10)
        t.seth(300)
        t.circle(10, 80)
        t.seth(220)
        t.fd(10)
        t.seth(300)
        t.circle(10, 80)
        t.seth(240)

        t.seth(0)
        t.fd(13)
        t.seth(240)
        t.circle(10, 70)

        t.circle(10, 70)
        t.seth(10)
        t.circle(300, 18)

        t.seth(75)
        t.circle(500, 8)
        t.left(180)

        #
        t.seth(320)
        t.circle(100, 5)
        t.left(180)

        t.seth(220)
        t.circle(200, 20)

        t.seth(60)

        t.circle(100, 20)

        t.seth(60)

        #
        t.seth(180)
        t.circle(-100, 10)
        t.left(180)
        t.circle(100, 10)
        t.seth(5)
        t.circle(100, 10)
        t.circle(-100, 40)
        t.circle(100, 35)
        t.left(180)
        t.circle(-100, 10)

        #
        t.seth(290)
        t.circle(100, 55)
        t.circle(10, 50)

        t.seth(120)
        t.circle(100, 20)
        t.left(180)
        t.circle(-100, 20)

        t.seth(0)
        t.circle(10, 50)

        t.seth(110)
        t.circle(100, 20)
        t.left(180)
        t.circle(-100, 20)

        t.seth(30)
        t.circle(20, 50)

        t.seth(100)
        t.circle(100, 40)

        #
        t.seth(200)
        t.circle(-100, 5)
        t.left(180)
        t.circle(100, 5)
        t.left(30)
        t.circle(100, 75)
        t.right(15)
        t.circle(-300, 21)
        t.left(180)
        t.circle(300, 3)

        #
        t.seth(43)
        t.circle(200, 60)

        t.right(10)
        t.fd(10)

        t.circle(5, 160)
        t.seth(90)
        t.circle(5, 160)
        t.seth(90)

        t.fd(10)
        t.seth(90)
        t.circle(5, 180)
        t.fd(10)

        t.left(180)
        t.left(20)
        t.fd(10)
        t.circle(5, 170)
        t.fd(10)
        t.seth(240)
        t.circle(50, 30)

        t.end_fill()
        self.meme(130, 125)
        t.seth(-20)
        t.fd(5)
        t.circle(-5, 160)
        t.fd(5)

        #
        self.meme(166, 130)
        t.seth(-90)
        t.fd(3)
        t.circle(-4, 180)
        t.fd(3)
        t.seth(-90)
        t.fd(3)
        t.circle(-4, 180)
        t.fd(3)

        #
        self.meme(168, 134)
        t.fillcolor('#F6D02F')
        t.begin_fill()
        t.seth(40)
        t.fd(200)
        t.seth(-80)
        t.fd(150)
        t.seth(210)
        t.fd(150)
        t.left(90)

        t.right(95)

        t.right(106)

        ##############
        # print(t.pos())
        t.seth(30)
        t.fd(40)

        #

        t.seth(30)

        t.left(100)

        t.hideturtle()

    def topi(self, x, y):
        self.meme(x, y)
        t = self.t
        t.fillcolor('#CD0000')
        t.begin_fill()
        t.seth(200)
        t.circle(400, 7)
        t.left(180)

        t.right(20)

        t.fd(70)
        # print(t.pos())
        t.right(35)
        t.fd(50)

        self.meme(-168.47, 185.52)
        t.seth(36)

    def start(self):

def main():
    print('Painting the Cartoon... ')
    try:
        turtle.screensize(1000, 800)
    except (AttributeError, Exception):
        pass
    turtle.title('Cartoon')
    drawing = Draw_Pikachu()
    drawing.start()
    turtle.mainloop()


if __name__ == '__main__':

  <script>
    let isDrawing = false;
    let isFast = false;
    let currentZoom = 1.0;
    const rawPythonCode = document.getElementById("pikachu-code").textContent;
    document.getElementById("code-content").textContent = rawPythonCode.trim();

    function autoScaleCanvas() {
      const wrapper = document.getElementById("canvas-wrapper");
      const box = document.getElementById("turtle-canvas-box");
      if (!wrapper || !box) return;

      const availWidth = wrapper.clientWidth;
      const baseWidth = 1000;
      const baseHeight = 800;

      let fitScale = 1.0;
      if (availWidth < baseWidth) {
        fitScale = availWidth / baseWidth;
      }

      const totalScale = fitScale * currentZoom;
      box.style.transform = "scale(" + totalScale + ")";
      wrapper.style.height = Math.round(baseHeight * totalScale) + "px";
    }

    window.addEventListener("resize", autoScaleCanvas);
    document.addEventListener("fullscreenchange", autoScaleCanvas);

    function outf(text) {
      console.log(text);
    }

    function builtinRead(x) {
      if (Sk.builtinFiles === undefined || Sk.builtinFiles["files"][x] === undefined) {
        throw "File not found: '" + x + "'";
      }
      return Sk.builtinFiles["files"][x];
    }

    function startDrawing() {
      const container = document.getElementById("turtle-canvas-box");
      container.innerHTML = "";
      const statusDot = document.getElementById("status-dot");
      const statusLabel = document.getElementById("status-label");

      statusDot.classList.remove("done");
      statusLabel.textContent = isFast ? "Drawing Pikachu (⚡ Fast Mode)..." : "Drawing Pikachu...";
      isDrawing = true;

      // Adjust speed if fast mode is active
      let codeToRun = rawPythonCode;
      if (isFast) {
        codeToRun = codeToRun.replace(/t\.speed\(\d+\)/g, "t.speed(0)");
      }

      Sk.configure({
        output: outf,
        read: builtinRead
      });

      Sk.TurtleGraphics = {
        target: "turtle-canvas-box",
        width: 1000,
        height: 800,
        animate: true
      };

      Sk.misceval.asyncToPromise(function() {
        return Sk.importMainWithBody("<stdin>", false, codeToRun, true);
      }).then(function() {
        isDrawing = false;
        statusDot.classList.add("done");
        statusLabel.textContent = "Drawing Complete! 🎉";
        autoScaleCanvas();
      }).catch(function(err) {
        console.error("Drawing error:", err);
        isDrawing = false;
        statusLabel.textContent = "Finished drawing";
        autoScaleCanvas();
      });

      setTimeout(autoScaleCanvas, 50);
    }

    document.getElementById("btn-restart").addEventListener("click", function() {
      startDrawing();
    });

    document.getElementById("btn-speed").addEventListener("click", function() {
      isFast = !isFast;
      this.textContent = isFast ? "🐢 Normal Speed" : "⚡ Fast Mode";
      startDrawing();
    });

    document.getElementById("btn-zoom-in").addEventListener("click", function() {
      currentZoom = Math.min(1.6, currentZoom + 0.1);
      autoScaleCanvas();
    });

    document.getElementById("btn-zoom-out").addEventListener("click", function() {
      currentZoom = Math.max(0.4, currentZoom - 0.1);
      autoScaleCanvas();
    });

    document.getElementById("btn-fullscreen").addEventListener("click", function() {
      const wrapper = document.getElementById("canvas-wrapper");
      if (!document.fullscreenElement) {
        if (wrapper.requestFullscreen) {
          wrapper.requestFullscreen();
        } else if (wrapper.webkitRequestFullscreen) {
          wrapper.webkitRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    });

    document.getElementById("btn-view-code").addEventListener("click", function() {
      const modal = document.getElementById("code-modal");
      const isVisible = modal.style.display === "block";
      modal.style.display = isVisible ? "none" : "block";
      this.textContent = isVisible ? "📜 View Code" : "❌ Hide Code";
    });

    document.getElementById("btn-download").addEventListener("click", function() {
      // Find all canvases inside turtle-canvas-box and combine them onto one export canvas
      const canvases = document.querySelectorAll("#turtle-canvas-box canvas");
      if (!canvases || canvases.length === 0) {
        alert("The canvas is still loading. Please wait a moment.");
        return;
      }
      const exportCanvas = document.createElement("canvas");
      exportCanvas.width = 1000;
      exportCanvas.height = 800;
      const ctx = exportCanvas.getContext("2d");
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, 1000, 800);
      canvases.forEach(c => {
        if (c.style.display !== "none") {
          ctx.drawImage(c, 0, 0);
        }
      });
      const link = document.createElement("a");
      link.download = "pikachu-python-turtle.png";
      link.href = exportCanvas.toDataURL("image/png");
      link.click();
    });

    // Start drawing automatically when the page is opened
    window.addEventListener("load", function() {
      startDrawing();
      autoScaleCanvas();
    });
  </script>
</body>
</html>
