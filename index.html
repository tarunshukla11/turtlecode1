<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pikachu — Python Turtle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt-stdlib.js"></script>
  <style>
    :root {
      --yellow: #facc15;
      --card: rgba(18,24,38,0.90);
      --border: rgba(255,255,255,0.12);
      --txt: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Outfit, sans-serif;
      background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #090d16 100%);
      min-height: 100vh; color: var(--txt);
      display: flex; flex-direction: column;
      align-items: center; padding: 20px 16px 40px;
    }
    header { text-align: center; margin-bottom: 16px; }
    .badge {
      display: inline-block; background: rgba(250,204,21,.12);
      color: var(--yellow); border: 1px solid rgba(250,204,21,.35);
      padding: 4px 14px; border-radius: 999px;
      font-size: .78rem; font-weight: 700; letter-spacing: .5px;
      text-transform: uppercase; margin-bottom: 8px;
    }
    h1 {
      font-size: clamp(2rem,4vw,2.8rem); font-weight: 800;
      background: linear-gradient(135deg,#fef08a,#facc15,#f97316);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .sub { color: var(--muted); font-size: .98rem; margin-top: 4px; }

    .wrap { width: 100%; max-width: 1160px; }

    .ctrl {
      background: var(--card); border: 1px solid var(--border);
      backdrop-filter: blur(16px); border-radius: 14px;
      padding: 12px 20px; display: flex; flex-wrap: wrap;
      align-items: center; justify-content: space-between; gap: 10px;
      margin-bottom: 14px; box-shadow: 0 12px 30px rgba(0,0,0,.4);
    }
    .status { display: flex; align-items: center; gap: 10px; }
    .dot {
      width: 11px; height: 11px; border-radius: 50%;
      background: #eab308; box-shadow: 0 0 10px #eab308;
      animation: pulse 1.4s infinite;
    }
    .dot.done { background: #22c55e; box-shadow: 0 0 10px #22c55e; animation: none; }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.85)} }
    .stxt { font-size: .9rem; font-weight: 600; }
    .btns { display: flex; gap: 8px; flex-wrap: wrap; }
    button {
      font-family: inherit; padding: 7px 13px; border-radius: 9px;
      font-size: .85rem; font-weight: 600; cursor: pointer;
      display: inline-flex; align-items: center; gap: 5px;
      background: rgba(255,255,255,.08); border: 1px solid var(--border);
      color: var(--txt); transition: all .2s;
    }
    button:hover { background: rgba(255,255,255,.16); transform: translateY(-2px); }
    button.pri {
      background: linear-gradient(135deg,#facc15,#eab308);
      color: #0b0f19; border: none;
      box-shadow: 0 4px 14px rgba(250,204,21,.35);
    }
    button.pri:hover { box-shadow: 0 6px 20px rgba(250,204,21,.5); }

    /* ──────────────────────────────────────────────
       CANVAS CARD
       The card clips to the natural size of #tbox.
       #tbox is exactly CW x CH via inline style set by JS.
       Skulpt renders its canvas layers using:
         layer 1: position:relative; display:block; margin-top:0
         layer 2: position:relative; display:block; margin-top:-CH
       We must NOT override those properties.
    ────────────────────────────────────────────── */
    .card {
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 24px 56px rgba(0,0,0,.65), 0 0 0 1px rgba(255,255,255,.14);
      width: 100%;
      overflow: hidden;        /* clips to canvas size */
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    /* The scaler div shrinks the native canvas to fit the screen */
    #scaler {
      transform-origin: top left;
      /* width/height set in JS to CW x CH so the card sizes itself */
    }
    /* NO canvas overrides — let Skulpt do its own stacking */

    .code-box {
      display: none; width: 100%; margin-top: 14px;
      background: #0f172a; border: 1px solid var(--border);
      border-radius: 12px; padding: 16px;
      max-height: 360px; overflow-y: auto;
    }
    .code-box pre { font-family: "JetBrains Mono",monospace; font-size: .78rem; color: #cbd5e1; line-height: 1.55; white-space: pre-wrap; }

    footer { margin-top: 28px; text-align: center; color: var(--muted); font-size: .85rem; }
    footer a { color: var(--yellow); text-decoration: none; font-weight: 600; }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
<header>
  <div class="badge">⚡ Interactive Python Live Demo</div>
  <h1>Pikachu in Python</h1>
  <p class="sub">Watch Python Turtle draw Pikachu stroke-by-stroke in your browser!</p>
</header>

<div class="wrap">
  <div class="ctrl">
    <div class="status">
      <div class="dot" id="dot"></div>
      <span class="stxt" id="slabel">Drawing Pikachu...</span>
    </div>
    <div class="btns">
      <button class="pri" id="bReplay">🔄 Replay</button>
      <button id="bSpeed">⚡ Fast Mode</button>
      <button id="bCode">📜 View Code</button>
      <button id="bSave">💾 Save PNG</button>
    </div>
  </div>

  <div class="card" id="card">
    <!-- scaler contains the native-size turtle target -->
    <div id="scaler">
      <div id="tbox"></div>
    </div>
  </div>

  <div class="code-box" id="codebox">
    <pre><code id="codetxt"></code></pre>
  </div>
</div>

<footer>Made with Python Turtle &bull; Powered by <a href="https://skulpt.org" target="_blank" rel="noopener">Skulpt</a> &bull; GitHub Pages</footer>

<script type="text/python" id="pysrc">
import turtle


def setup(x, y):
    turtle.setx(x)
    turtle.sety(y)
    print(x, y)


class Draw_Pikachu:

    def __init__(self):
        self.t = turtle.Turtle()
        t = self.t
        t.pensize(3)
        t.speed(9)
        t.ondrag(setup)

    def meme(self, x, y):
        self.t.penup()
        self.t.goto(x, y)
        self.t.pendown()

    def aankha1(self, x, y):
        self.meme(x, y)
        t = self.t
        t.seth(0)
        t.fillcolor('#333333')
        t.begin_fill()
        t.circle(22)
        t.end_fill()

        self.meme(x, y + 10)
        t.fillcolor('#000000')
        t.begin_fill()
        t.circle(10)
        t.end_fill()

        self.meme(x + 6, y + 22)
        t.fillcolor('#ffffff')
        t.begin_fill()
        t.circle(10)
        t.end_fill()

    def aankha2(self, x, y):
        self.meme(x, y)
        t = self.t
        t.seth(0)
        t.fillcolor('#333333')
        t.begin_fill()
        t.circle(22)
        t.end_fill()

        self.meme(x, y + 10)
        t.fillcolor('#000000')
        t.begin_fill()
        t.circle(10)
        t.end_fill()

        self.meme(x - 6, y + 22)
        t.fillcolor('#ffffff')
        t.begin_fill()
        t.circle(10)
        t.end_fill()

    def mukh(self, x, y):
        self.meme(x, y)
        t = self.t

        t.fillcolor('#88141D')
        t.begin_fill()
        #
        l1 = []
        l2 = []
        t.seth(190)
        a = 0.7
        for i in range(28):
            a += 0.1
            t.right(3)
            t.fd(a)
            l1.append(t.position())

        self.meme(x, y)

        t.seth(10)
        a = 0.7
        for i in range(28):
            a += 0.1
            t.left(3)
            t.fd(a)
            l2.append(t.position())

        #

        t.seth(10)
        t.circle(50, 15)
        t.left(180)
        t.circle(-50, 15)

        t.circle(-50, 40)
        t.seth(233)
        t.circle(-50, 55)
        t.left(180)
        t.circle(50, 12.1)
        t.end_fill()

        #
        self.meme(17, 54)
        t.fillcolor('#DD716F')
        t.begin_fill()
        t.seth(145)
        t.circle(40, 86)
        t.penup()
        for pos in reversed(l1[:20]):
            t.goto(pos[0], pos[1] + 1.5)
        for pos in l2[:20]:
            t.goto(pos[0], pos[1] + 1.5)
        t.pendown()
        t.end_fill()

        #
        self.meme(-17, 94)
        t.seth(8)
        t.fd(4)
        t.back(8)

    #
    def gaala1(self, x, y):
        turtle.tracer(False)
        t = self.t
        self.meme(x, y)
        t.seth(300)
        t.fillcolor('#DD4D28')
        t.begin_fill()
        a = 2.3
        for i in range(120):
            if 0 <= i < 30 or 60 <= i < 90:
                a -= 0.05
                t.lt(3)
                t.fd(a)
            else:
                a += 0.05
                t.lt(3)
                t.fd(a)
        t.end_fill()
        turtle.tracer(True)

    def gaala2(self, x, y):
        t = self.t

        t.begin_fill()
        t.seth(330)
        t.circle(100, 35)

        t.circle(300, 40)
        t.circle(30, 50)
        t.seth(20)
        t.circle(300, 35)
        # print(t.pos())

        t.seth(240)

        t.left(180)

        #
        t.seth(210)
        t.circle(500, 18)
        t.seth(200)
        t.fd(10)
        t.seth(280)
        t.fd(7)
        t.seth(210)
        t.fd(10)
        t.seth(300)

        t.seth(220)

        t.seth(300)

        t.seth(240)

        t.seth(240)

        t.seth(10)
        t.circle(300, 18)

        t.seth(75)

        t.left(180)
        t.circle(-500, 15)
        t.seth(250)

        #
        t.seth(320)
        t.circle(100, 5)
        t.left(180)
        t.circle(-100, 5)
        t.seth(220)
        t.circle(200, 20)
        t.circle(20, 70)

        t.seth(60)
        t.circle(-100, 20)
        t.left(180)
        t.circle(100, 20)
        t.seth(300)
        t.circle(10, 70)

        t.seth(60)
        t.circle(-100, 20)
        t.left(180)

        t.seth(10)

        #
        t.seth(180)
        t.circle(-100, 10)
        t.left(180)
        t.circle(100, 10)
        t.seth(5)
        t.circle(100, 10)
        t.circle(-100, 40)
        t.circle(100, 35)
        t.left(180)
        t.circle(-100, 10)

        #
        t.seth(290)
        t.circle(100, 55)
        t.circle(10, 50)

        t.seth(120)
        t.circle(100, 20)
        t.left(180)
        t.circle(-100, 20)

        t.seth(0)
        t.circle(10, 50)

        t.seth(110)
        t.circle(100, 20)
        t.left(180)
        t.circle(-100, 20)

        t.seth(30)
        t.circle(20, 50)

        t.seth(100)
        t.circle(100, 40)

        #
        t.seth(200)
        t.circle(-100, 5)
        t.left(180)
        t.circle(100, 5)
        t.left(30)
        t.circle(100, 75)
        t.right(15)
        t.circle(-300, 21)
        t.left(180)

        #
        t.seth(43)

        t.right(10)

        t.circle(5, 160)
        t.seth(90)
        t.circle(5, 160)
        t.seth(90)

        t.fd(10)
        t.seth(90)
        t.circle(5, 180)
        t.fd(10)

        t.left(180)
        t.left(20)
        t.fd(10)
        t.circle(5, 170)
        t.fd(10)
        t.seth(240)
        t.circle(50, 30)

        t.end_fill()
        self.meme(130, 125)
        t.seth(-20)
        t.fd(5)
        t.circle(-5, 160)
        t.fd(5)

        #
        self.meme(166, 130)
        t.seth(-90)
        t.fd(3)
        t.circle(-4, 180)
        t.fd(3)
        t.seth(-90)
        t.fd(3)
        t.circle(-4, 180)
        t.fd(3)

        #
        self.meme(168, 134)
        t.fillcolor('#F6D02F')
        t.begin_fill()
        t.seth(40)
        t.fd(200)
        t.seth(-80)
        t.fd(150)
        t.seth(210)
        t.fd(150)
        t.left(90)

        t.right(95)
        t.fd(100)
        t.left(110)
        t.fd(70)
        t.right(110)
        t.fd(80)
        t.left(110)
        t.fd(30)
        t.right(110)
        t.fd(32)

        t.right(106)
        t.circle(100, 25)
        t.right(15)
        t.circle(-300, 2)
        ##############
        # print(t.pos())
        t.seth(30)
        t.fd(40)
        t.left(100)
        t.fd(70)
        t.right(100)
        t.fd(80)
        t.left(100)
        t.fd(46)
        t.seth(66)
        t.circle(200, 38)
        t.right(10)
        t.fd(10)
        t.end_fill()

        #
        t.fillcolor('#923E24')
        self.meme(126.82, -156.84)
        t.begin_fill()

        t.seth(30)
        t.fd(40)
        t.left(100)
        t.fd(40)
        t.pencolor('#923e24')
        t.seth(-30)
        t.fd(30)
        t.left(140)
        t.fd(20)
        t.right(150)
        t.fd(20)
        t.left(150)
        t.fd(20)
        t.right(150)
        t.fd(20)
        t.left(130)
        t.fd(18)
        t.pencolor('#000000')
        t.seth(-45)
        t.fd(67)
        t.right(110)
        t.fd(80)
        t.left(110)
        t.fd(30)
        t.right(110)
        t.fd(32)
        t.right(106)
        t.circle(100, 25)
        t.right(15)
        t.circle(-300, 2)
        t.end_fill()

        self.topi(-134.07, 147.81)
        self.mukh(-5, 25)
        self.gaala1(-126, 32)
        self.gaala2(107, 63)
        self.kaan1(-250, 100)
        self.kaan2(140, 270)
        self.aankha1(-85, 90)
        self.aankha2(50, 110)
        t.hideturtle()

    def topi(self, x, y):
        self.meme(x, y)
        t = self.t
        t.fillcolor('#CD0000')
        t.begin_fill()
        t.seth(200)
        t.circle(400, 7)
        t.left(180)
        t.circle(-400, 30)
        t.circle(30, 60)
        t.fd(50)
        t.circle(30, 45)
        t.fd(60)
        t.left(5)
        t.circle(30, 70)
        t.right(20)
        t.circle(200, 70)
        t.circle(30, 60)
        t.fd(70)
        # print(t.pos())
        t.right(35)
        t.fd(50)
        t.circle(8, 100)
        t.end_fill()
        self.meme(-168.47, 185.52)
        t.seth(36)
        t.circle(-270, 54)
        t.left(180)
        t.circle(270, 27)
        t.circle(-80, 98)

        t.fillcolor('#444444')
        t.begin_fill()
        t.left(180)
        t.circle(80, 197)
        t.left(58)
        t.circle(200, 45)
        t.end_fill()

        self.meme(-58, 270)
        t.pencolor('#228B22')
        t.dot(35)

        self.meme(-30, 280)
        t.fillcolor('#228B22')
        t.begin_fill()
        t.seth(100)
        t.circle(30, 180)
        t.seth(190)
        t.fd(15)
        t.seth(100)
        t.circle(-45, 180)
        t.right(90)
        t.fd(15)
        t.end_fill()
        t.pencolor('#000000')

    def start(self):
        self.jiu()


def main():
    print('Painting the Cartoon... ')
    try:
        turtle.screensize(800, 600)
    except (AttributeError, Exception):
        pass
    turtle.title('Cartoon')
    drawing = Draw_Pikachu()
    drawing.start()
    turtle.mainloop()


if __name__ == '__main__':
    main()

<script>
const CW = 1120, CH = 700;
let fast = false;
const src = document.getElementById("pysrc").textContent;
document.getElementById("codetxt").textContent = src.trim();

function scale() {
  const card    = document.getElementById("card");
  const scaler  = document.getElementById("scaler");
  const avail   = card.clientWidth;
  const s       = Math.min(1, avail / CW);
  // Set scaler to native size so card knows the content size
  scaler.style.width  = CW + "px";
  scaler.style.height = CH + "px";
  scaler.style.transform = "scale(" + s + ")";
  scaler.style.transformOrigin = "top left";
  // Shrink card height to match scaled content
  card.style.height = Math.round(CH * s) + "px";
}
window.addEventListener("resize", scale);

function draw() {
  // Clear previous render
  document.getElementById("tbox").innerHTML = "";

  const dot   = document.getElementById("dot");
  const lbl   = document.getElementById("slabel");
  dot.classList.remove("done");
  lbl.textContent = fast ? "Drawing (⚡ Fast)..." : "Drawing Pikachu...";

  let code = src;
  if (fast) code = code.replace(/t\.speed\(\d+\)/g, "t.speed(0)");

  Sk.configure({ output: t => console.log(t), read: x => {
    if (!Sk.builtinFiles?.["files"]?.[x]) throw "File not found: " + x;
    return Sk.builtinFiles["files"][x];
  }});

  Sk.TurtleGraphics = {
    target:  "tbox",
    width:   CW,
    height:  CH,
    animate: true
  };

  Sk.misceval.asyncToPromise(() =>
    Sk.importMainWithBody("<stdin>", false, code, true)
  ).then(() => {
    dot.classList.add("done");
    lbl.textContent = "Drawing Complete! 🎉";
    scale();
  }).catch(e => {
    console.error(e);
    lbl.textContent = "Done";
    scale();
  });

  setTimeout(scale, 80);
}

document.getElementById("bReplay").onclick = draw;
document.getElementById("bSpeed").onclick = function() {
  fast = !fast;
  this.textContent = fast ? "🐢 Normal Speed" : "⚡ Fast Mode";
  draw();
};
document.getElementById("bCode").onclick = function() {
  const b = document.getElementById("codebox");
  const open = b.style.display === "block";
  b.style.display = open ? "none" : "block";
  this.textContent = open ? "📜 View Code" : "❌ Hide Code";
};
document.getElementById("bSave").onclick = function() {
  // Merge all visible Skulpt canvas layers into one export
  const layers = [...document.querySelectorAll("#tbox canvas")]
                   .filter(c => c.style.display !== "none");
  if (!layers.length) { alert("Still drawing — wait a moment."); return; }
  const out = document.createElement("canvas");
  out.width = CW; out.height = CH;
  const ctx = out.getContext("2d");
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, CW, CH);
  layers.forEach(c => ctx.drawImage(c, 0, 0));
  const a = document.createElement("a");
  a.download = "pikachu.png";
  a.href = out.toDataURL("image/png");
  a.click();
};

window.addEventListener("load", () => { scale(); draw(); });
</script>
