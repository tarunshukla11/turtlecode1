<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>Pikachu — Python Turtle Art</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt.min.js"></script>

  <style>
    :root {
      --accent-yellow: #facc15;
      --card-bg: rgba(18, 24, 38, 0.90);
      --card-border: rgba(255,255,255,0.12);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Outfit", sans-serif;
      background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #090d16 100%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px 40px;
    }
    header { text-align: center; margin-bottom: 16px; }
    .badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(250,204,21,0.12); color: var(--accent-yellow);
      border: 1px solid rgba(250,204,21,0.35);
      padding: 5px 16px; border-radius: 999px;
      font-size: 0.8rem; font-weight: 700; letter-spacing: 0.5px;
      text-transform: uppercase; margin-bottom: 8px;
    }
    h1 {
      font-size: clamp(2rem, 4vw, 2.8rem); font-weight: 800;
      background: linear-gradient(135deg, #fef08a 0%, #facc15 50%, #f97316 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px; line-height: 1.15;
    }
    .subtitle { color: var(--text-muted); font-size: 1rem; margin-top: 6px; }

    .container { width: 100%; max-width: 1200px; display: flex; flex-direction: column; align-items: center; }

    /* Controls bar */
    .controls-card {
      background: var(--card-bg); border: 1px solid var(--card-border);
      backdrop-filter: blur(16px); border-radius: 16px;
      padding: 12px 20px; width: 100%;
      display: flex; flex-wrap: wrap; align-items: center;
      justify-content: space-between; gap: 10px;
      margin-bottom: 14px; box-shadow: 0 12px 30px rgba(0,0,0,0.45);
    }
    .status-group { display: flex; align-items: center; gap: 10px; }
    .dot {
      width: 11px; height: 11px; border-radius: 50%;
      background: #eab308; box-shadow: 0 0 10px #eab308;
      animation: pulse 1.4s infinite;
    }
    .dot.done { background: #22c55e; box-shadow: 0 0 10px #22c55e; animation: none; }
    @keyframes pulse {
      0%,100% { opacity:1; transform:scale(1); }
      50% { opacity:0.4; transform:scale(0.85); }
    }
    .status-text { font-size: 0.92rem; font-weight: 600; }
    .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
    button {
      font-family: inherit; background: rgba(255,255,255,0.08);
      border: 1px solid var(--card-border); color: var(--text-main);
      padding: 7px 13px; border-radius: 9px; font-size: 0.85rem; font-weight: 600;
      cursor: pointer; display: inline-flex; align-items: center; gap: 5px;
      transition: all 0.2s;
    }
    button:hover { background: rgba(255,255,255,0.16); transform: translateY(-2px); }
    button.primary {
      background: linear-gradient(135deg, #facc15, #eab308);
      color: #0b0f19; border: none;
      box-shadow: 0 4px 14px rgba(250,204,21,0.35);
    }
    button.primary:hover { box-shadow: 0 6px 20px rgba(250,204,21,0.5); }

    /* Canvas card — white box that fits the canvas */
    .canvas-card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.65), 0 0 0 1px rgba(255,255,255,0.15);
      width: 100%;
      overflow: hidden;
      /* Height will be set by JS after we know the scale */
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* The turtle render target — fixed at native size,
       then scaled down by JS to fit the card */
    #turtle-canvas-box {
      width: 1140px;
      height: 720px;
      flex-shrink: 0;
      transform-origin: top left;
    }
    /* Make every skulpt canvas layer sit on top of each other */
    #turtle-canvas-box canvas {
      display: block !important;
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
    }

    /* Code panel */
    .code-modal {
      display: none; width: 100%; margin-top: 14px;
      background: #0f172a; border: 1px solid var(--card-border);
      border-radius: 14px; padding: 16px;
      max-height: 380px; overflow-y: auto;
    }
    .code-modal pre { font-family: "JetBrains Mono", monospace; font-size: 0.79rem; color: #cbd5e1; line-height: 1.55; white-space: pre-wrap; }

    footer { margin-top: 28px; text-align: center; color: var(--text-muted); font-size: 0.85rem; }
    footer a { color: var(--accent-yellow); text-decoration: none; font-weight: 600; }
    footer a:hover { text-decoration: underline; }
  </style>
</head>

<script type="text/python" id="py-src">
import turtle


def setup(x, y):
    turtle.setx(x)
    turtle.sety(y)
    print(x, y)


class Draw_Pikachu:

    def __init__(self):
        self.t = turtle.Turtle()
        t = self.t
        t.pensize(3)
        t.speed(9)
        t.ondrag(setup)

    def meme(self, x, y):
        self.t.penup()
        self.t.goto(x, y)
        self.t.pendown()

    def aankha1(self, x, y):
        self.meme(x, y)
        t = self.t
        t.seth(0)
        t.fillcolor('#333333')
        t.begin_fill()
        t.circle(22)
        t.end_fill()

        self.meme(x, y + 10)
        t.fillcolor('#000000')
        t.begin_fill()
        t.circle(10)
        t.end_fill()

        self.meme(x + 6, y + 22)
        t.fillcolor('#ffffff')
        t.begin_fill()
        t.circle(10)
        t.end_fill()

    def aankha2(self, x, y):
        self.meme(x, y)
        t = self.t
        t.seth(0)
        t.fillcolor('#333333')
        t.begin_fill()
        t.circle(22)
        t.end_fill()

        self.meme(x, y + 10)
        t.fillcolor('#000000')
        t.begin_fill()
        t.circle(10)
        t.end_fill()

        self.meme(x - 6, y + 22)
        t.fillcolor('#ffffff')
        t.begin_fill()
        t.circle(10)
        t.end_fill()

    def mukh(self, x, y):
        self.meme(x, y)
        t = self.t

        t.fillcolor('#88141D')
        t.begin_fill()
        #
        l1 = []
        l2 = []
        t.seth(190)
        a = 0.7
        for i in range(28):
            a += 0.1
            t.right(3)
            t.fd(a)
            l1.append(t.position())

        self.meme(x, y)

        t.seth(10)
        a = 0.7
        for i in range(28):
            a += 0.1
            t.left(3)
            t.fd(a)
            l2.append(t.position())

        #

        t.seth(10)
        t.circle(50, 15)
        t.left(180)
        t.circle(-50, 15)

        t.circle(-50, 40)
        t.seth(233)
        t.circle(-50, 55)
        t.left(180)
        t.circle(50, 12.1)
        t.end_fill()

        #
        self.meme(17, 54)
        t.fillcolor('#DD716F')
        t.begin_fill()
        t.seth(145)
        t.circle(40, 86)
        t.penup()
        for pos in reversed(l1[:20]):
            t.goto(pos[0], pos[1] + 1.5)
        for pos in l2[:20]:
            t.goto(pos[0], pos[1] + 1.5)
        t.pendown()
        t.end_fill()

        #
        self.meme(-17, 94)
        t.seth(8)
        t.fd(4)
        t.back(8)

    #
    def gaala1(self, x, y):
        turtle.tracer(False)
        t = self.t
        self.meme(x, y)
        t.seth(300)
        t.fillcolor('#DD4D28')
        t.begin_fill()
        a = 2.3
        for i in range(120):
            if 0 <= i < 30 or 60 <= i < 90:
                a -= 0.05
                t.lt(3)
                t.fd(a)
            else:
                a += 0.05
                t.lt(3)
                t.fd(a)
        t.end_fill()
        turtle.tracer(True)

    def gaala2(self, x, y):
        t = self.t
        turtle.tracer(False)
        self.meme(x, y)
        t.seth(60)
        t.fillcolor('#DD4D28')
        t.begin_fill()
        a = 2.3
        for i in range(120):
            if 0 <= i < 30 or 60 <= i < 90:
                a -= 0.05
                t.lt(3)
                t.fd(a)
            else:
                a += 0.05
                t.lt(3)
                t.fd(a)
        t.end_fill()
        turtle.tracer(True)

    def kaan1(self, x, y):
        t = self.t
        self.meme(x, y)
        t.fillcolor('#000000')
        t.begin_fill()
        t.seth(330)
        t.circle(100, 35)
        t.seth(219)
        t.circle(-300, 19)
        t.seth(110)
        t.circle(-30, 50)
        t.circle(-300, 10)
        t.end_fill()

    def kaan2(self, x, y):
        t = self.t
        self.meme(x, y)
        t.fillcolor('#000000')
        t.begin_fill()
        t.seth(300)
        t.circle(-100, 30)
        t.seth(35)
        t.circle(300, 15)
        t.circle(30, 50)
        t.seth(190)
        t.circle(300, 17)
        t.end_fill()

    def jiu(self):

        t.fillcolor('#F6D02F')

        #
        t.penup()

        #
        t.seth(20)

        t.seth(190)

        #
        t.seth(150)
        t.circle(150, 70)

        #
        t.seth(200)
        t.circle(300, 40)
        t.circle(30, 50)
        t.seth(20)
        t.circle(300, 35)
        # print(t.pos())

        #
        t.seth(240)
        t.circle(105, 95)
        t.left(180)
        t.circle(-105, 5)

        #
        t.seth(210)
        t.circle(500, 18)
        t.seth(200)
        t.fd(10)
        t.seth(280)
        t.fd(7)
        t.seth(210)
        t.fd(10)
        t.seth(300)
        t.circle(10, 80)
        t.seth(220)
        t.fd(10)
        t.seth(300)
        t.circle(10, 80)
        t.seth(240)
        t.fd(12)
        t.seth(0)
        t.fd(13)
        t.seth(240)
        t.circle(10, 70)
        t.seth(10)
        t.circle(10, 70)
        t.seth(10)
        t.circle(300, 18)

        t.seth(75)
        t.circle(500, 8)
        t.left(180)
        t.circle(-500, 15)
        t.seth(250)
        t.circle(100, 65)

        #
        t.seth(320)
        t.circle(100, 5)
        t.left(180)
        t.circle(-100, 5)
        t.seth(220)
        t.circle(200, 20)
        t.circle(20, 70)

        t.seth(60)
        t.circle(-100, 20)
        t.left(180)
        t.circle(100, 20)
        t.seth(300)
        t.circle(10, 70)

        t.seth(60)
        t.circle(-100, 20)
        t.left(180)
        t.circle(100, 20)
        t.seth(10)
        t.circle(100, 60)

        #
        t.seth(180)
        t.circle(-100, 10)
        t.left(180)
        t.circle(100, 10)
        t.seth(5)
        t.circle(100, 10)
        t.circle(-100, 40)
        t.circle(100, 35)
        t.left(180)
        t.circle(-100, 10)

        #
        t.seth(290)
        t.circle(100, 55)
        t.circle(10, 50)

        t.seth(120)
        t.circle(100, 20)
        t.left(180)
        t.circle(-100, 20)

        t.seth(0)
        t.circle(10, 50)

        t.seth(110)
        t.circle(100, 20)
        t.left(180)
        t.circle(-100, 20)

        t.seth(30)
        t.circle(20, 50)

        t.seth(100)
        t.circle(100, 40)

        #
        t.seth(200)
        t.circle(-100, 5)
        t.left(180)
        t.circle(100, 5)
        t.left(30)
        t.circle(100, 75)
        t.right(15)
        t.circle(-300, 21)
        t.left(180)
        t.circle(300, 3)

        #
        t.seth(43)
        t.circle(200, 60)

        t.right(10)
        t.fd(10)

        t.circle(5, 160)
        t.seth(90)
        t.circle(5, 160)
        t.seth(90)

        t.fd(10)
        t.seth(90)
        t.circle(5, 180)
        t.fd(10)

        t.left(180)
        t.left(20)
        t.fd(10)
        t.circle(5, 170)
        t.fd(10)
        t.seth(240)
        t.circle(50, 30)

        t.end_fill()
        self.meme(130, 125)
        t.seth(-20)
        t.fd(5)
        t.circle(-5, 160)
        t.fd(5)

        #
        self.meme(166, 130)
        t.seth(-90)
        t.fd(3)
        t.circle(-4, 180)
        t.fd(3)
        t.seth(-90)
        t.fd(3)
        t.circle(-4, 180)
        t.fd(3)

        #
        self.meme(168, 134)
        t.fillcolor('#F6D02F')
        t.begin_fill()
        t.seth(40)
        t.fd(200)
        t.seth(-80)
        t.fd(150)
        t.seth(210)
        t.fd(150)
        t.left(90)
        t.fd(100)
        t.right(95)
        t.fd(100)
        t.left(110)
        t.fd(70)
        t.right(110)
        t.fd(80)
        t.left(110)
        t.fd(30)
        t.right(110)
        t.fd(32)

        t.right(106)
        t.circle(100, 25)
        t.right(15)
        t.circle(-300, 2)
        ##############
        # print(t.pos())
        t.seth(30)
        t.fd(40)
        t.left(100)
        t.fd(70)
        t.right(100)
        t.fd(80)
        t.left(100)
        t.fd(46)
        t.seth(66)
        t.circle(200, 38)
        t.right(10)
        t.fd(10)
        t.end_fill()

        #
        t.fillcolor('#923E24')
        self.meme(126.82, -156.84)
        t.begin_fill()

        t.seth(30)
        t.fd(40)
        t.left(100)
        t.fd(40)
        t.pencolor('#923e24')
        t.seth(-30)
        t.fd(30)
        t.left(140)
        t.fd(20)
        t.right(150)
        t.fd(20)
        t.left(150)
        t.fd(20)
        t.right(150)
        t.fd(20)
        t.left(130)
        t.fd(18)
        t.pencolor('#000000')
        t.seth(-45)
        t.fd(67)
        t.right(110)
        t.fd(80)
        t.left(110)
        t.fd(30)
        t.right(110)
        t.fd(32)
        t.right(106)
        t.circle(100, 25)
        t.right(15)

        self.topi(-134.07, 147.81)
        self.mukh(-5, 25)
        self.gaala1(-126, 32)
        self.gaala2(107, 63)
        self.kaan1(-250, 100)
        self.kaan2(140, 270)
        self.aankha1(-85, 90)
        self.aankha2(50, 110)
        t.hideturtle()

    def topi(self, x, y):
        self.meme(x, y)
        t = self.t
        t.fillcolor('#CD0000')
        t.begin_fill()
        t.seth(200)
        t.circle(400, 7)
        t.left(180)
        t.circle(-400, 30)
        t.circle(30, 60)
        t.fd(50)
        t.circle(30, 45)
        t.fd(60)
        t.left(5)
        t.circle(30, 70)
        t.right(20)
        t.circle(200, 70)
        t.circle(30, 60)
        t.fd(70)
        # print(t.pos())
        t.right(35)
        t.fd(50)
        t.circle(8, 100)
        t.end_fill()
        self.meme(-168.47, 185.52)
        t.seth(36)
        t.circle(-270, 54)
        t.left(180)
        t.circle(270, 27)
        t.circle(-80, 98)

        t.fillcolor('#444444')
        t.begin_fill()
        t.left(180)
        t.circle(80, 197)
        t.left(58)
        t.circle(200, 45)
        t.end_fill()

        self.meme(-58, 270)
        t.pencolor('#228B22')
        t.dot(35)

        self.meme(-30, 280)
        t.fillcolor('#228B22')
        t.begin_fill()
        t.seth(100)
        t.circle(30, 180)
        t.seth(190)
        t.fd(15)
        t.seth(100)
        t.circle(-45, 180)
        t.right(90)
        t.fd(15)
        t.end_fill()
        t.pencolor('#000000')

    def start(self):
        self.jiu()


def main():
    print('Painting the Cartoon... ')
    try:
        turtle.screensize(800, 600)
    except (AttributeError, Exception):
        pass
    turtle.title('Cartoon')
    drawing = Draw_Pikachu()
    drawing.start()
    turtle.mainloop()


if __name__ == '__main__':
    main()

<script>
  const NATIVE_W = 1140;
  const NATIVE_H = 720;

  let isFast = false;
  const src = document.getElementById("py-src").textContent;
  document.getElementById("code-content").textContent = src.trim();

  /* ── Scale canvas to fit the card ── */
  function scaleBox() {
    const card = document.getElementById("canvas-card");
    const box  = document.getElementById("turtle-canvas-box");
    const avail = card.clientWidth;
    const scale = Math.min(1, avail / NATIVE_W);
    box.style.transform = "scale(" + scale + ")";
    box.style.transformOrigin = "top left";
    card.style.height = Math.round(NATIVE_H * scale) + "px";
  }
  window.addEventListener("resize", scaleBox);
  scaleBox();

  /* ── Skulpt helpers ── */
  function outf(t) { console.log(t); }
  function builtinRead(x) {
    if (!Sk.builtinFiles || !Sk.builtinFiles["files"][x])
      throw "File not found: '" + x + "'";
    return Sk.builtinFiles["files"][x];
  }

  /* ── Run drawing ── */
  function run() {
    document.getElementById("turtle-canvas-box").innerHTML = "";
    const dot   = document.getElementById("dot");
    const label = document.getElementById("status-label");
    dot.classList.remove("done");
    label.textContent = isFast ? "Drawing Pikachu (⚡ Fast)..." : "Drawing Pikachu...";

    let code = src;
    if (isFast) code = code.replace(/t\.speed\(\d+\)/g, "t.speed(0)");

    Sk.configure({ output: outf, read: builtinRead });
    Sk.TurtleGraphics = {
      target: "turtle-canvas-box",
      width:  NATIVE_W,
      height: NATIVE_H,
      animate: true
    };

    Sk.misceval.asyncToPromise(() =>
      Sk.importMainWithBody("<stdin>", false, code, true)
    ).then(() => {
      dot.classList.add("done");
      label.textContent = "Drawing Complete! 🎉";
      scaleBox();
    }).catch(err => {
      console.error(err);
      label.textContent = "Done";
      scaleBox();
    });

    setTimeout(scaleBox, 100);
  }

  /* ── Buttons ── */
  document.getElementById("btn-replay").onclick = run;

  document.getElementById("btn-speed").onclick = function() {
    isFast = !isFast;
    this.textContent = isFast ? "🐢 Normal Speed" : "⚡ Fast Mode";
    run();
  };

  document.getElementById("btn-code").onclick = function() {
    const m = document.getElementById("code-modal");
    const open = m.style.display === "block";
    m.style.display = open ? "none" : "block";
    this.textContent = open ? "📜 View Code" : "❌ Hide Code";
  };

  document.getElementById("btn-save").onclick = function() {
    const canvases = [...document.querySelectorAll("#turtle-canvas-box canvas")]
                       .filter(c => c.style.display !== "none");
    if (!canvases.length) { alert("Still loading — try again in a moment."); return; }
    const out = document.createElement("canvas");
    out.width = NATIVE_W; out.height = NATIVE_H;
    const ctx = out.getContext("2d");
    ctx.fillStyle = "#fff";
    ctx.fillRect(0, 0, NATIVE_W, NATIVE_H);
    canvases.forEach(c => ctx.drawImage(c, 0, 0));
    const a = document.createElement("a");
    a.download = "pikachu-turtle.png";
    a.href = out.toDataURL("image/png");
    a.click();
  };

  /* ── Auto-start ── */
  window.addEventListener("load", () => { run(); scaleBox(); });
</script>
</body>
</html>
